<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Snowball Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti untuk animasi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .checkbox-custom:checked + div { background-color: #10b981; border-color: #10b981; }
        .checkbox-custom:checked + div svg { display: block; }
        .cbr-locked { filter: grayscale(100%) blur(2px); opacity: 0.5; transition: all 1s ease; }
        .cbr-unlocked { filter: grayscale(0%) blur(0px); opacity: 1; transform: scale(1.05); transition: all 1s ease; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                Master Plan Pelunasan
            </h1>
            <p class="text-slate-400">Roadmap Menuju Bebas Finansial & CBR250RR (Mei 2027)</p>
        </header>

        <!-- Progress Section -->
        <div class="glass-card rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <p class="text-sm text-slate-400">Total Progres Akun Lunas</p>
                    <h2 class="text-2xl font-bold"><span id="lunasCount">0</span> / 9 Akun</h2>
                </div>
                <div class="text-right">
                    <p class="text-sm text-slate-400">Persentase</p>
                    <h2 class="text-2xl font-bold text-emerald-400" id="progressPercent">0%</h2>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-700 rounded-full h-4 overflow-hidden relative">
                <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-emerald-500 h-4 rounded-full transition-all duration-700 w-0"></div>
            </div>
        </div>

        <!-- Timeline Grid -->
        <div id="timelineContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Cards will be injected here via JS -->
        </div>

        <!-- Reward Section -->
        <div class="glass-card rounded-2xl p-6 shadow-xl text-center mt-8 overflow-hidden relative">
            <h3 class="text-xl font-bold mb-4">Ultimate Reward: Honda CBR250RR</h3>
            <p id="rewardText" class="text-sm text-slate-400 mb-4">Selesaikan 9 misi pelunasan di atas untuk membuka akses menabung unit ini.</p>
            <div class="relative max-w-sm mx-auto">
                <div id="cbrImage" class="cbr-locked bg-slate-800 rounded-xl p-4 border border-slate-700">
                    <p class="text-6xl py-8">🏍️</p>
                    <p class="font-bold text-slate-300">Target Cash: Rp35.000.000</p>
                </div>
                <div id="lockOverlay" class="absolute inset-0 flex items-center justify-center">
                    <span class="text-4xl bg-slate-900 rounded-full p-3 shadow-lg">🔒</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Roadmap Pelunasan
        const debts = [
            { id: 1, name: "ShopeePinjam 2", date: "Oktober 2026", amount: "Rp 696.000" },
            { id: 2, name: "ShopeePinjam 1", date: "November 2026", amount: "Rp 879.000" },
            { id: 3, name: "SeaBank Zulfa 1", date: "Desember 2026", amount: "Rp 1.568.000" },
            { id: 4, name: "ShopeePinjam 3", date: "Januari 2027", amount: "Sisa Saldo" },
            { id: 5, name: "Adapundi", date: "Februari 2027", amount: "Sisa Saldo" },
            { id: 6, name: "SeaBank Zulfa 2", date: "Februari 2027", amount: "Sisa Saldo" },
            { id: 7, name: "Jago Zulfa 1", date: "Februari 2027", amount: "Sisa Saldo" },
            { id: 8, name: "Jago Zulfa 2", date: "Mei 2027", amount: "Rp 6.331.485" },
            { id: 9, name: "Jago Zulfa 3", date: "Mei 2027", amount: "Rp 2.831.485" }
        ];

        let checkedCount = 0;

        // Render Cards
        const container = document.getElementById('timelineContainer');
        debts.forEach((debt, index) => {
            const card = document.createElement('div');
            card.className = "glass-card p-5 rounded-xl flex items-start gap-4 transition-all hover:bg-slate-800 cursor-pointer";
            card.setAttribute('onclick', `toggleDebt('checkbox-${debt.id}')`);
            
            card.innerHTML = `
                <div class="pt-1">
                    <label class="relative flex items-center cursor-pointer">
                        <input type="checkbox" id="checkbox-${debt.id}" class="checkbox-custom sr-only" onchange="updateProgress()">
                        <div class="w-6 h-6 border-2 border-slate-500 rounded flex items-center justify-center transition-colors">
                            <svg class="w-4 h-4 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                    </label>
                </div>
                <div class="flex-1 pointer-events-none">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-blue-400 bg-blue-400/10 px-2 py-1 rounded">${debt.date}</span>
                        <span class="text-xs text-slate-500">Misi ${index + 1}</span>
                    </div>
                    <h3 class="font-bold text-lg mt-2">${debt.name}</h3>
                    <p class="text-sm text-slate-400 mt-1">${debt.amount}</p>
                </div>
            `;
            container.appendChild(card);
        });

        // Update Progress Logic
        function toggleDebt(id) {
            const checkbox = document.getElementById(id);
            checkbox.checked = !checkbox.checked;
            updateProgress();
        }

        function updateProgress() {
            const checkboxes = document.querySelectorAll('.checkbox-custom');
            checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            const total = debts.length;
            const percentage = Math.round((checkedCount / total) * 100);

            // Update UI Stats
            document.getElementById('lunasCount').innerText = checkedCount;
            document.getElementById('progressPercent').innerText = `${percentage}%`;
            document.getElementById('progressBar').style.width = `${percentage}%`;

            // Check if all clear (100%)
            if (checkedCount === total) {
                triggerVictory();
            } else {
                lockReward();
            }
        }

        // Victory State
        function triggerVictory() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#10b981', '#3b82f6', '#f8fafc']
            });
            
            // Unlock CBR250RR
            const cbrImage = document.getElementById('cbrImage');
            const lockOverlay = document.getElementById('lockOverlay');
            
            cbrImage.classList.remove('cbr-locked');
            cbrImage.classList.add('cbr-unlocked');
            lockOverlay.style.display = 'none';
            document.getElementById('rewardText').innerHTML = "<span class='text-emerald-400 font-bold'>UTANG LUNAS! Saatnya tabung Rp 3.000.000/bulan untuk motor impian!</span>";
        }

        function lockReward() {
            const cbrImage = document.getElementById('cbrImage');
            const lockOverlay = document.getElementById('lockOverlay');
            
            cbrImage.classList.add('cbr-locked');
            cbrImage.classList.remove('cbr-unlocked');
            lockOverlay.style.display = 'flex';
            document.getElementById('rewardText').innerText = "Selesaikan 9 misi pelunasan di atas untuk membuka akses menabung unit ini.";
        }
    </script>
</body>
</html>
